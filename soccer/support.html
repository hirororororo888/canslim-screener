<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b3d1e">
<title>うごきかた ミキワメ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; background:#0b3d1e; color:#fff; min-height:100vh; display:flex; justify-content:center; user-select:none; }
  #app { width:100%; max-width:640px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  h1 { font-size:22px; text-align:center; margin:6px 0 0; }
  .hud { display:flex; justify-content:space-between; font-size:18px; font-weight:bold; }
  svg { width:100%; display:block; background:repeating-linear-gradient(0deg,#2e9e4f 0 40px,#2a9148 40px 80px); border:4px solid #fff; border-radius:12px; touch-action:manipulation; }
  .cand { cursor:pointer; }
  button { font-family:inherit; font-weight:bold; border:none; border-radius:14px; cursor:pointer; color:#fff; }
  .main { font-size:26px; padding:16px 28px; background:#f5a623; box-shadow:0 5px 0 #b47410; }
  .panel { background:rgba(0,0,0,.35); border-radius:12px; padding:14px; text-align:center; line-height:1.7; }
  .opts { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0; }
  .opts button { background:#444; padding:10px 16px; font-size:16px; }
  .opts button.on { background:#f5a623; }
  .big { font-size:34px; font-weight:bold; color:#ffe14d; }
  .hidden { display:none !important; }
  .ok { color:#7dff9b; } .ng { color:#ff8a8a; }
  #msg { text-align:center; font-size:22px; font-weight:bold; min-height:32px; }
  a { color:#ffe14d; }
</style>
</head>
<body>
<div id="app">
  <h1>⚽ どこへ うごく？</h1>

  <div id="start" class="panel">
    <p>青い 味方が ボールを もっているよ。<br>いまの <b>じぶん（黄色）</b>の ばしょでは パスを もらえない！<br>
    どこへ <b>うごけば</b> いいかな？<br>
    <small>・パスの 道が 赤い 相手に ふさがれていない<br>・うごく 先に 相手が ちかくにいない<br>この 2つを まもる ばしょを タップ！<br>（20回 せいかいするまでの タイム）</small></p>
    <button class="main" id="startBtn">スタート！</button>
    <p id="best" style="font-size:14px;margin:8px 0 0"></p>
    <p style="font-size:14px"><a href="index.html">← パスコース ミキワメへ</a>　<a href="move3d.html">3D版 →</a></p>
  </div>

  <div id="game" class="hidden">
    <div class="hud"><span id="count">1 / 20</span><span id="time">0.0 びょう</span><span id="okc">❌ 0</span></div>
    <svg id="field" viewBox="0 0 400 300"></svg>
    <div id="msg"></div>
  </div>

  <div id="result" class="panel hidden">
    <div>おつかれさま！</div>
    <div class="big" id="rTotal"></div>
    <div id="rDetail"></div>
    <div id="rRank" style="font-size:20px"></div>
    <p><button class="main" id="againBtn">もういちど</button></p>
  </div>
</div>

<script>
(() => {
  const TOTAL = 20, R = 20, NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  let correct, miss, startT, tick, q, locked, qT, rts;

  const bestKey = () => 'soccerMoveBest20';
  function getBest() { try { return JSON.parse(localStorage.getItem(bestKey())); } catch (e) { return null; } }
  function showBest() { const b = getBest(); $('best').textContent = b ? `このゲームの ベスト：${b.t.toFixed(1)}びょう（ミス${b.m}かい）` : ''; }
  showBest();

  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function segDist(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, t = clamp(((p.x - a.x) * dx + (p.y - a.y) * dy) / (dx * dx + dy * dy), 0, 1);
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }
  const pt = (B, deg, r) => { const a = deg * Math.PI / 180; return { x: B.x + Math.cos(a) * r, y: B.y + Math.sin(a) * r * 0.9 }; };

  // 問題：自分(P)のパスの道を相手D1がふさいでいる。
  // 候補は ①Pのすぐ近く(D1にふさがれたまま) ②相手D2がマークしている ③ぜんぶ空いている → 正解は③の1つ
  function makeQuestion() {
    for (;;) {
      const B = { x: rnd(140, 260), y: rnd(115, 185) }, th = rnd(0, 360), sgn = Math.random() < 0.5 ? 1 : -1;
      const P = pt(B, th, rnd(88, 100));
      const t = rnd(0.5, 0.58), D1 = { x: B.x + (P.x - B.x) * t + rnd(-4, 4), y: B.y + (P.y - B.y) * t + rnd(-4, 4) };
      const cs = [pt(B, th + sgn * rnd(26, 31), rnd(88, 98)), pt(B, th + sgn * rnd(105, 130), rnd(85, 100)), pt(B, th - sgn * rnd(90, 110), rnd(85, 100))];
      const ma = rnd(0, Math.PI * 2);
      const D2 = { x: clamp(cs[1].x + Math.cos(ma) * 46, 22, 378), y: clamp(cs[1].y + Math.sin(ma) * 46, 22, 278) };
      const defs = [D1, D2];
      const status = cs.map(c => defs.some(d => segDist(d, B, c) < 34) ? 'lane' : defs.some(d => dist(d, c) < 56) ? 'mark' : 'free');
      if (status.filter(x => x === 'free').length !== 1) continue;
      if (cs.some(c => c.x < 30 || c.x > 370 || c.y < 30 || c.y > 270) || P.x < 25 || P.x > 375 || P.y < 25 || P.y > 275) continue;
      if (cs.some((c, i) => cs.some((d, j) => i < j && dist(c, d) < 55) || dist(c, P) < 44 && c !== cs[0])) continue;
      // 候補どうしが近すぎる/相手と重なるものは作り直し
      if (cs.some(c => defs.some(d => dist(c, d) < 42)) || [B, P, D1].some(o => dist(D2, o) < 44)) continue;
      // 候補を並べ替え（①②③ の位置をバラす）
      const idx = [0, 1, 2].sort(() => Math.random() - 0.5);
      return { B, P, defs, cands: idx.map(i => cs[i]), status: idx.map(i => status[i]), answer: idx.findIndex(i => status[i] === 'free'), D1, D2 };
    }
  }

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }
  function label(svg, x, y, txt, size, fill) { const t = el('text', { x, y, 'text-anchor': 'middle', 'font-size': size, 'font-weight': 'bold', fill }, svg); t.textContent = txt; }

  function draw() {
    const svg = $('field'); svg.innerHTML = '';
    el('line', { x1: 0, y1: 150, x2: 400, y2: 150, stroke: 'rgba(255,255,255,.35)', 'stroke-width': 2 }, svg);
    el('line', { x1: q.B.x, y1: q.B.y, x2: q.P.x, y2: q.P.y, stroke: 'rgba(255,255,255,.35)', 'stroke-width': 2, 'stroke-dasharray': '5 6' }, svg);
    q.defs.forEach(d => { el('circle', { cx: d.x, cy: d.y, r: R, fill: '#e02b2b', stroke: '#fff', 'stroke-width': 3 }, svg); label(svg, d.x, d.y + 5, '相手', 14, '#fff'); });
    el('circle', { cx: q.P.x, cy: q.P.y, r: R + 2, fill: '#f5c518', stroke: '#fff', 'stroke-width': 3 }, svg); label(svg, q.P.x, q.P.y + 5, 'じぶん', 12, '#000');
    el('circle', { cx: q.B.x, cy: q.B.y, r: R + 2, fill: '#1e6fe8', stroke: '#fff', 'stroke-width': 3 }, svg); label(svg, q.B.x, q.B.y + 7, '⚽', 20, '#fff');
    q.cands.forEach((c, i) => {
      const g = el('g', { class: 'cand' }, svg);
      el('circle', { cx: c.x, cy: c.y, r: R, fill: 'rgba(255,255,255,.88)', stroke: '#f5c518', 'stroke-width': 4, 'stroke-dasharray': '6 4' }, g);
      label(g, c.x, c.y + 8, i + 1, 22, '#000');
      g.addEventListener('pointerdown', e => { e.preventDefault(); choose(i); });
    });
  }

  function start() {
    correct = 0; miss = 0; rts = [];
    $('start').classList.add('hidden'); $('result').classList.add('hidden'); $('game').classList.remove('hidden');
    startT = performance.now();
    tick = setInterval(() => $('time').textContent = ((performance.now() - startT) / 1000).toFixed(1) + ' びょう', 100);
    $('okc').textContent = '❌ 0';
    next();
  }

  function next() {
    if (correct >= TOTAL) return finish();
    $('count').textContent = `${correct + 1} / ${TOTAL}`;
    $('msg').textContent = '';
    q = makeQuestion(); draw(); qT = performance.now(); locked = false;
  }

  function choose(i) {
    if (locked) return;
    locked = true;
    if (i === q.answer) {
      correct++; rts.push(performance.now() - qT);
      $('msg').innerHTML = '<span class="ok">⭕ ナイス ポジション！</span>';
      setTimeout(next, 450);
    } else {
      miss++;
            $('msg').innerHTML = `<span class="ng">❌ ${q.status[i] === 'lane' ? 'まだ パスの 道が ふさがれてるよ' : 'そこは 相手が ちかいよ'}</span>`;
      $('okc').textContent = '❌ ' + miss;
      const c = q.cands[q.answer];
      el('line', { x1: q.B.x, y1: q.B.y, x2: c.x, y2: c.y, stroke: '#7dff9b', 'stroke-width': 5 }, $('field'));
      el('line', { x1: q.P.x, y1: q.P.y, x2: c.x, y2: c.y, stroke: '#ffe14d', 'stroke-width': 3, 'stroke-dasharray': '2 6' }, $('field'));
      setTimeout(next, 1300);
    }
  }

  function finish() {
    clearInterval(tick);
    const total = (performance.now() - startT) / 1000;
    const avg = rts.reduce((a, b) => a + b, 0) / rts.length / 1000;
    $('game').classList.add('hidden'); $('result').classList.remove('hidden');
    $('rTotal').textContent = `${total.toFixed(1)} びょう`;
    $('rDetail').innerHTML = `${TOTAL}かい せいかい（ミス ${miss}かい）<br>1もんの へいきん ${avg.toFixed(2)} びょう`;
    const b = getBest(), better = !b || total < b.t;
    if (better) { try { localStorage.setItem(bestKey(), JSON.stringify({ t: total, m: miss })); } catch (e) {} }
    $('rRank').textContent = better ? '🏆 ベストきろく こうしん！' : `ベスト：${b.t.toFixed(1)}びょう`;
    showBest();
  }

  $('startBtn').onclick = start;
  $('againBtn').onclick = () => { $('result').classList.add('hidden'); $('start').classList.remove('hidden'); };
})();
</script>
</body>
</html>
