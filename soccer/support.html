<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b3d1e">
<title>サポートいち ミキワメ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; background:#0b3d1e; color:#fff; min-height:100vh; display:flex; justify-content:center; user-select:none; }
  #app { width:100%; max-width:640px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  h1 { font-size:22px; text-align:center; margin:6px 0 0; }
  .hud { display:flex; justify-content:space-between; font-size:18px; font-weight:bold; }
  svg { width:100%; display:block; background:repeating-linear-gradient(0deg,#2e9e4f 0 40px,#2a9148 40px 80px); border:4px solid #fff; border-radius:12px; touch-action:manipulation; }
  .cand { cursor:pointer; }
  button { font-family:inherit; font-weight:bold; border:none; border-radius:14px; cursor:pointer; color:#fff; }
  .main { font-size:26px; padding:16px 28px; background:#f5a623; box-shadow:0 5px 0 #b47410; }
  .panel { background:rgba(0,0,0,.35); border-radius:12px; padding:14px; text-align:center; line-height:1.7; }
  .opts { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0; }
  .opts button { background:#444; padding:10px 16px; font-size:16px; }
  .opts button.on { background:#f5a623; }
  .big { font-size:34px; font-weight:bold; color:#ffe14d; }
  .hidden { display:none !important; }
  .ok { color:#7dff9b; } .ng { color:#ff8a8a; }
  #msg { text-align:center; font-size:22px; font-weight:bold; min-height:32px; }
  a { color:#ffe14d; }
</style>
</head>
<body>
<div id="app">
  <h1>⚽ サポートいち ミキワメ</h1>

  <div id="start" class="panel">
    <p>青い 味方が ボールを もっているよ。<br>パスを もらうために <b>じぶんが 立つ ばしょ</b>は？<br>
    <small>・パスの 道が 赤い 相手に ふさがれていない<br>・もらう 場所に 相手が ちかくにいない<br>この 2つを まもる ばしょを タップ！<br>（20回 せいかいするまでの タイム）</small></p>
    <div>ばしょの かず</div>
    <div class="opts" id="modeOpts">
      <button data-v="3" class="on">3つから（相手2人）</button>
      <button data-v="4">4つから（相手3人）</button>
    </div>
    <button class="main" id="startBtn">スタート！</button>
    <p id="best" style="font-size:14px;margin:8px 0 0"></p>
    <p style="font-size:14px"><a href="index.html">← パスコース ミキワメへ</a></p>
  </div>

  <div id="game" class="hidden">
    <div class="hud"><span id="count">1 / 20</span><span id="time">0.0 びょう</span><span id="okc">❌ 0</span></div>
    <svg id="field" viewBox="0 0 400 300"></svg>
    <div id="msg"></div>
  </div>

  <div id="result" class="panel hidden">
    <div>おつかれさま！</div>
    <div class="big" id="rTotal"></div>
    <div id="rDetail"></div>
    <div id="rRank" style="font-size:20px"></div>
    <p><button class="main" id="againBtn">もういちど</button></p>
  </div>
</div>

<script>
(() => {
  const TOTAL = 20, R = 20, NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  let mode = 3, correct, miss, startT, tick, q, locked, qT, rts;

  document.querySelectorAll('#modeOpts button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#modeOpts button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); mode = +b.dataset.v; showBest();
  });
  const bestKey = () => 'soccerSupportBest20_' + mode;
  function getBest() { try { return JSON.parse(localStorage.getItem(bestKey())); } catch (e) { return null; } }
  function showBest() { const b = getBest(); $('best').textContent = b ? `このゲームの ベスト：${b.t.toFixed(1)}びょう（ミス${b.m}かい）` : ''; }
  showBest();

  const rnd = (a, b) => a + Math.random() * (b - a);

  // 問題生成：ボール保持者B、候補n個。n-1人の相手が「パスの道をふさぐ」か「もらう人をマーク」し、ふさがれていない1つが正解
  function makeQuestion() {
    const n = mode, B = { x: rnd(150, 250), y: rnd(120, 180) };
    const base = rnd(0, 360), cands = [];
    for (let i = 0; i < n; i++) {
      const a = (base + i * 360 / n + rnd(-12, 12)) * Math.PI / 180, r = rnd(85, 100);
      cands.push({ x: B.x + Math.cos(a) * r, y: B.y + Math.sin(a) * r * 0.9 });
    }
    const answer = Math.floor(Math.random() * n), defs = [];
    cands.forEach((c, i) => {
      if (i === answer) return;
      if (Math.random() < 0.5) { // 道をふさぐ
        const t = rnd(0.58, 0.7);
        defs.push({ x: B.x + (c.x - B.x) * t + rnd(-5, 5), y: B.y + (c.y - B.y) * t + rnd(-5, 5), kind: 'lane', for: i });
      } else { // もらう人をマーク
        const a = rnd(0, Math.PI * 2);
        defs.push({ x: c.x + Math.cos(a) * 24, y: c.y + Math.sin(a) * 24, kind: 'mark', for: i });
      }
    });
    return { B, cands, defs, answer };
  }

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }

  function draw() {
    const svg = $('field'); svg.innerHTML = '';
    el('line', { x1: 0, y1: 150, x2: 400, y2: 150, stroke: 'rgba(255,255,255,.35)', 'stroke-width': 2 }, svg);
    q.cands.forEach(c => el('line', { x1: q.B.x, y1: q.B.y, x2: c.x, y2: c.y, stroke: 'rgba(255,255,255,.35)', 'stroke-width': 2, 'stroke-dasharray': '5 6' }, svg));
    q.defs.forEach(d => {
      el('circle', { cx: d.x, cy: d.y, r: R, fill: '#e02b2b', stroke: '#fff', 'stroke-width': 3 }, svg);
      const t = el('text', { x: d.x, y: d.y + 5, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 'bold', fill: '#fff' }, svg); t.textContent = '相手';
    });
    el('circle', { cx: q.B.x, cy: q.B.y, r: R + 2, fill: '#1e6fe8', stroke: '#fff', 'stroke-width': 3 }, svg);
    const bt = el('text', { x: q.B.x, y: q.B.y + 7, 'text-anchor': 'middle', 'font-size': 20 }, svg); bt.textContent = '⚽';
    q.cands.forEach((c, i) => {
      const g = el('g', { class: 'cand' }, svg);
      el('circle', { cx: c.x, cy: c.y, r: R + 2, fill: 'rgba(245,197,24,.9)', stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': '6 4' }, g);
      const t = el('text', { x: c.x, y: c.y + 8, 'text-anchor': 'middle', 'font-size': 22, 'font-weight': 'bold', fill: '#000' }, g); t.textContent = i + 1;
      g.addEventListener('pointerdown', e => { e.preventDefault(); choose(i); });
    });
  }

  function start() {
    correct = 0; miss = 0; rts = [];
    $('start').classList.add('hidden'); $('result').classList.add('hidden'); $('game').classList.remove('hidden');
    startT = performance.now();
    tick = setInterval(() => $('time').textContent = ((performance.now() - startT) / 1000).toFixed(1) + ' びょう', 100);
    $('okc').textContent = '❌ 0';
    next();
  }

  function next() {
    if (correct >= TOTAL) return finish();
    $('count').textContent = `${correct + 1} / ${TOTAL}`;
    $('msg').textContent = '';
    q = makeQuestion(); draw(); qT = performance.now(); locked = false;
  }

  function choose(i) {
    if (locked) return;
    locked = true;
    if (i === q.answer) {
      correct++; rts.push(performance.now() - qT);
      $('msg').innerHTML = '<span class="ok">⭕ ナイス ポジション！</span>';
      setTimeout(next, 450);
    } else {
      miss++;
      const d = q.defs.find(d => d.for === i);
      $('msg').innerHTML = `<span class="ng">❌ ${d.kind === 'lane' ? 'パスの 道が ふさがれてるよ' : 'そこは 相手が ちかいよ'}</span>`;
      $('okc').textContent = '❌ ' + miss;
      const c = q.cands[q.answer];
      el('line', { x1: q.B.x, y1: q.B.y, x2: c.x, y2: c.y, stroke: '#7dff9b', 'stroke-width': 5 }, $('field'));
      setTimeout(next, 1300);
    }
  }

  function finish() {
    clearInterval(tick);
    const total = (performance.now() - startT) / 1000;
    const avg = rts.reduce((a, b) => a + b, 0) / rts.length / 1000;
    $('game').classList.add('hidden'); $('result').classList.remove('hidden');
    $('rTotal').textContent = `${total.toFixed(1)} びょう`;
    $('rDetail').innerHTML = `${TOTAL}かい せいかい（ミス ${miss}かい）<br>1もんの へいきん ${avg.toFixed(2)} びょう`;
    const b = getBest(), better = !b || total < b.t;
    if (better) { try { localStorage.setItem(bestKey(), JSON.stringify({ t: total, m: miss })); } catch (e) {} }
    $('rRank').textContent = better ? '🏆 ベストきろく こうしん！' : `ベスト：${b.t.toFixed(1)}びょう`;
    showBest();
  }

  $('startBtn').onclick = start;
  $('againBtn').onclick = () => { $('result').classList.add('hidden'); $('start').classList.remove('hidden'); };
})();
</script>
</body>
</html>
