<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>パスコース ミキワメ トレーニング</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; background:#0b3d1e; color:#fff; min-height:100vh; display:flex; justify-content:center; user-select:none; }
  #app { width:100%; max-width:640px; padding:12px; display:flex; flex-direction:column; gap:10px; }
  h1 { font-size:22px; text-align:center; margin:6px 0 0; }
  .hud { display:flex; justify-content:space-between; font-size:18px; font-weight:bold; }
  .pitch { position:relative; width:100%; aspect-ratio:4/3; background:repeating-linear-gradient(0deg,#2e9e4f 0 40px,#2a9148 40px 80px); border:4px solid #fff; border-radius:12px; overflow:hidden; }
  .pitch::before { content:""; position:absolute; left:0; right:0; top:50%; border-top:3px solid rgba(255,255,255,.5); }
  .p { position:absolute; width:18%; aspect-ratio:1; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:clamp(14px,4vw,22px); font-weight:bold; border:3px solid #fff; transform:translate(-50%,-50%); }
  .mate { background:#1e6fe8; top:30%; }
  #mateL { left:20%; } #mateR { left:80%; }
  .me { background:#f5c518; color:#000; left:50%; top:82%; }
  .opp { background:#e02b2b; top:58%; opacity:0; }
  #oppL { left:20%; } #oppR { left:80%; }
  .opp.flash { opacity:1; }
  .ball { position:absolute; left:50%; top:70%; transform:translate(-50%,-50%); font-size:clamp(20px,6vw,32px); }
  .msg { position:absolute; left:0; right:0; top:8%; text-align:center; font-size:clamp(20px,6vw,34px); font-weight:bold; text-shadow:0 2px 6px #000; pointer-events:none; }
  .btns { display:flex; gap:10px; }
  button { font-family:inherit; font-weight:bold; border:none; border-radius:14px; cursor:pointer; color:#fff; }
  .pass { flex:1; font-size:clamp(22px,7vw,34px); padding:26px 0; background:#1e6fe8; box-shadow:0 5px 0 #124a9e; }
  .pass:active { transform:translateY(4px); box-shadow:0 1px 0 #124a9e; }
  .pass:disabled { opacity:.45; }
  .main { font-size:26px; padding:16px 28px; background:#f5a623; box-shadow:0 5px 0 #b47410; }
  .panel { background:rgba(0,0,0,.35); border-radius:12px; padding:14px; text-align:center; line-height:1.7; }
  .opts { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:8px 0; }
  .opts button { background:#444; padding:10px 16px; font-size:16px; }
  .opts button.on { background:#f5a623; }
  .big { font-size:34px; font-weight:bold; color:#ffe14d; }
  .hidden { display:none !important; }
  .ok { color:#7dff9b; } .ng { color:#ff8a8a; }
</style>
</head>
<body>
<div id="app">
  <h1>⚽ パスコース ミキワメ</h1>

  <div id="start" class="panel">
    <p>あかい 相手が <b>ピカッ</b> と出たら、<br>相手が<b>いない方</b>の 味方に パス！<br>（30回 せいかいするまでの タイムをはかるよ。まちがえたら やりなおし）</p>
    <div>ひかる 時間</div>
    <div class="opts" id="durOpts">
      <button data-v="500">ゆっくり</button>
      <button data-v="300" class="on">ふつう</button>
      <button data-v="150">はやい</button>
    </div>
    <button class="main" id="startBtn">スタート！</button>
    <p id="best" style="font-size:14px;margin:8px 0 0"></p>
  </div>

  <div id="game" class="hidden">
    <div class="hud"><span id="count">1 / 30</span><span id="time">0.0 びょう</span><span id="okc">⭕ 0</span></div>
    <div class="pitch">
      <div class="p mate" id="mateL">味方</div>
      <div class="p mate" id="mateR">味方</div>
      <div class="p opp" id="oppL">相手</div>
      <div class="p opp" id="oppR">相手</div>
      <div class="p me">じぶん</div>
      <div class="ball">⚽</div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="btns" style="margin-top:10px">
      <button class="pass" id="btnL" disabled>◀ ひだり</button>
      <button class="pass" id="btnR" disabled>みぎ ▶</button>
    </div>
  </div>

  <div id="result" class="panel hidden">
    <div>おつかれさま！</div>
    <div class="big" id="rTotal"></div>
    <div id="rDetail"></div>
    <div id="rRank" style="font-size:20px"></div>
    <p><button class="main" id="againBtn">もういちど</button></p>
  </div>
</div>

<script>
(() => {
  const TOTAL = 30;
  const $ = id => document.getElementById(id);
  let flashMs = 300, correct, startT, flashT, answer, waiting, timer, hideTimer, rts, miss, tick;

  document.querySelectorAll('#durOpts button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#durOpts button').forEach(x => x.classList.remove('on'));
    b.classList.add('on'); flashMs = +b.dataset.v; showBest();
  });
  function bestKey() { return 'soccerPassBest2_' + flashMs; }
  function getBest() { try { return JSON.parse(localStorage.getItem(bestKey())); } catch (e) { return null; } }
  function showBest() {
    const b = getBest();
    $('best').textContent = b ? `この むずかしさの ベスト：${b.t.toFixed(1)}びょう（ミス${b.m}かい）` : '';
  }
  showBest();

  function start() {
    correct = 0; miss = 0; rts = []; waiting = false;
    $('start').classList.add('hidden'); $('result').classList.add('hidden'); $('game').classList.remove('hidden');
    startT = performance.now();
    tick = setInterval(() => $('time').textContent = ((performance.now() - startT) / 1000).toFixed(1) + ' びょう', 100);
    $('okc').textContent = '❌ 0';
    next();
  }

  function next() {
    if (correct >= TOTAL) return finish();
    $('count').textContent = `${correct + 1} / ${TOTAL}`;
    $('msg').textContent = '';
    setBtns(false);
    timer = setTimeout(flash, 600 + Math.random() * 900);
  }

  function flash() {
    const side = Math.random() < 0.5 ? 'L' : 'R';
    answer = side === 'L' ? 'R' : 'L'; // 相手がいない方
    $('opp' + side).classList.add('flash');
    flashT = performance.now(); waiting = true; setBtns(true);
    hideTimer = setTimeout(() => $('opp' + side).classList.remove('flash'), flashMs);
  }

  function setBtns(on) { $('btnL').disabled = $('btnR').disabled = !on; }

  function choose(side) {
    if (!waiting) return;
    waiting = false; setBtns(false);
    const rt = performance.now() - flashT;
    clearTimeout(hideTimer);
    $('oppL').classList.remove('flash'); $('oppR').classList.remove('flash');
    if (side === answer) {
      correct++; rts.push(rt);
      $('msg').innerHTML = '<span class="ok">⭕ ナイスパス！</span>';
    } else {
      miss++;
      $('msg').innerHTML = '<span class="ng">❌ そっちは 相手が いたよ</span>';
    }
    $('okc').textContent = '❌ ' + miss;
    setTimeout(next, 500);
  }

  function finish() {
    clearInterval(tick);
    const total = (performance.now() - startT) / 1000;
    const avg = rts.length ? rts.reduce((a, b) => a + b, 0) / rts.length / 1000 : 0;
    $('game').classList.add('hidden'); $('result').classList.remove('hidden');
    $('rTotal').textContent = `${total.toFixed(1)} びょう`;
    $('rDetail').innerHTML = `${TOTAL}かい せいかい（ミス ${miss}かい）<br>はんのう へいきん ${avg.toFixed(2)} びょう`;
    const b = getBest();
    const better = !b || total < b.t;
    if (better) { try { localStorage.setItem(bestKey(), JSON.stringify({ t: total, m: miss })); } catch (e) {} }
    $('rRank').textContent = better ? '🏆 ベストきろく こうしん！' : `ベスト：${b.t.toFixed(1)}びょう`;
    showBest();
  }

  $('startBtn').onclick = start;
  $('againBtn').onclick = () => { $('result').classList.add('hidden'); $('start').classList.remove('hidden'); };
  $('btnL').addEventListener('pointerdown', e => { e.preventDefault(); choose('L'); });
  $('btnR').addEventListener('pointerdown', e => { e.preventDefault(); choose('R'); });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') choose('L');
    else if (e.key === 'ArrowRight') choose('R');
  });
})();
</script>
</body>
</html>
